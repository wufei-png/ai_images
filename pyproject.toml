[project]
name = "ai-images"
version = "0.1.0"
description = "ControlNet eight-legged horse comparison (CUDA / RTX 4090)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0.0",
    "controlnet-aux>=0.0.9",
    "diffusers>=0.32.0",
    "matplotlib>=3.9.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "safetensors>=0.4.0",
    "socksio>=1.0.0",
    # Driver 535 / CUDA 12.2：用 cu121 轮子，避免 PyPI 默认 CUDA 13 的 NCCL 冲突
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers>=4.44.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
