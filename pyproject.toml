[project]
name = "ai-images"
version = "0.1.0"
description = "ControlNet eight-legged horse comparison (CUDA / RTX 4090)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0.0",
    "controlnet-aux>=0.0.9",
    "diffusers>=0.32.0",
    "matplotlib>=3.9.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "safetensors>=0.4.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
]

[tool.uv]
package = false
